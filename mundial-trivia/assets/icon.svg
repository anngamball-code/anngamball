<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Fondo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#065f46" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- Balón centrado en el área segura del icono adaptativo -->
  <g transform="translate(512 470)">
    <circle r="250" fill="#ffffff" stroke="#0b3d2e" stroke-width="10" />
    <!-- Pentágono central -->
    <path d="M0 -120 L114 -37 L70 98 L-70 98 L-114 -37 Z" fill="#0b3d2e" />
    <!-- Costuras hacia los bordes -->
    <g stroke="#0b3d2e" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-120" x2="0" y2="-230" />
      <line x1="114" y1="-37" x2="220" y2="-78" />
      <line x1="70" y1="98" x2="150" y2="190" />
      <line x1="-70" y1="98" x2="-150" y2="190" />
      <line x1="-114" y1="-37" x2="-220" y2="-78" />
    </g>
  </g>

  <!-- Año -->
  <text x="512" y="900" text-anchor="middle"
    font-family="Arial, sans-serif" font-size="170" font-weight="900"
    fill="#ffc800" letter-spacing="6">2026</text>
</svg>
