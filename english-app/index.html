<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoOwl — Aprende inglés 🦉</title>

    <!-- Fuentes redondeadas y amigables -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS vía Play CDN (no requiere instalación con npm) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Nunito", "system-ui", "sans-serif"],
              display: ["Fredoka", "Nunito", "sans-serif"],
            },
            colors: {
              duo: {
                green: "#58CC02",
                greenDark: "#46A302",
                blue: "#1CB0F6",
                blueDark: "#1899D6",
                yellow: "#FFC800",
                red: "#FF4B4B",
                redDark: "#E63F3F",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
