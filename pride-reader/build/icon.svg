<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23234a" />
      <stop offset="1" stop-color="#1a1a2e" />
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="200" fill="url(#bg)" />

  <!-- Libro abierto -->
  <g transform="translate(512 540)">
    <!-- Páginas -->
    <path d="M-300 -150 C -180 -200, -40 -200, 0 -160 C 40 -200, 180 -200, 300 -150 L 300 170 C 180 120, 40 120, 0 160 C -40 120, -180 120, -300 170 Z"
      fill="#e8e0d0" />
    <!-- Lomo central -->
    <path d="M0 -160 L0 160" stroke="#c9a84c" stroke-width="10" />
    <!-- Líneas de texto (izquierda) -->
    <g stroke="#c9a84c" stroke-width="12" stroke-linecap="round" opacity="0.7">
      <line x1="-250" y1="-90" x2="-50" y2="-90" />
      <line x1="-250" y1="-40" x2="-50" y2="-40" />
      <line x1="-250" y1="10" x2="-50" y2="10" />
      <line x1="-250" y1="60" x2="-90" y2="60" />
    </g>
    <!-- Líneas de texto (derecha) -->
    <g stroke="#c9a84c" stroke-width="12" stroke-linecap="round" opacity="0.7">
      <line x1="50" y1="-90" x2="250" y2="-90" />
      <line x1="50" y1="-40" x2="250" y2="-40" />
      <line x1="50" y1="10" x2="250" y2="10" />
      <line x1="90" y1="60" x2="250" y2="60" />
    </g>
  </g>

  <!-- Marcador dorado -->
  <path d="M620 200 L700 200 L700 360 L660 325 L620 360 Z" fill="#c9a84c" />
</svg>
